<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a3a4a"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bgGrad)"/>

  <!-- Wave layers -->
  <path d="M0,140 C150,180 350,100 600,145 C850,190 1050,110 1200,145 L1200,200 L0,200 Z" fill="#0d1117" opacity="0.4"/>
  <path d="M0,155 C200,120 450,185 700,150 C900,122 1100,170 1200,158 L1200,200 L0,200 Z" fill="#0d1117" opacity="0.6"/>
  <path d="M0,168 C250,145 500,195 750,165 C950,142 1100,178 1200,170 L1200,200 L0,200 Z" fill="#0d1117"/>

  <!-- Nama gradient -->
  <text
    x="600" y="82"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    fill="url(#nameGrad)"
  >Geral Tritama</text>

  <!-- Subtitle -->
  <text
    x="600" y="130"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="19"
    font-weight="400"
    fill="#2dd4bf"
    opacity="0.85"
  >Full Stack Web Developer</text>
</svg>
